publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.6
  sqflite: ^2.3.2
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  pdf: ^3.10.8

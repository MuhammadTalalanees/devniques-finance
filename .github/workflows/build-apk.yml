# Devniques Finance — release APK builder (GitHub Actions)
#
# DRAFT — prepared 2026-10-14 ~10:00 PKT as the fix for the stalled local APK builds.
# To use: commit this file to the repo at .github/workflows/build-apk.yml on the
# main branch (repo: MuhammadTalalanees/devniques-finance), then go to the
# repo's Actions tab -> "Build release APK" -> "Run workflow".
# The finished app-release.apk appears under the run's Artifacts (~10-25 min).
#
# Why CI: the build VM has ~325MB available RAM vs Gradle's 3GB heap -> repeated
# OOM/stalls. GitHub's ubuntu-latest runners have 16GB RAM. No secrets needed:
# the Supabase URL + publishable (anon) key are already baked as defaults in
# lib/core/config.dart, so the APK connects to the live DB out of the box.
# Repo ships lib/ only (no android/); the workflow scaffolds the native shell
# with `flutter create` exactly like the repo README's "Build release files" step.

name: Build release APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.7 (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Scaffold native Android shell (repo ships lib/ only)
        run: |
          flutter create --org com.devniques --project-name devniques_finance app_build
          cp -r lib app_build/lib
          cp pubspec.yaml app_build/pubspec.yaml

      - name: Get dependencies
        working-directory: app_build
        run: flutter pub get

      - name: Static check
        working-directory: app_build
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        working-directory: app_build
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: devniques-finance-release-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

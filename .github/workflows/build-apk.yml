name: Build release APK




on:
  workflow_dispatch:




jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4




      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"




      - name: Set up Flutter 3.47.7 (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true




      - name: Scaffold native Android shell (repo ships lib/ only)
        run: |
          flutter create --org com.devniques --project-name devniques_finance app_build
          rm -rf app_build/lib
          cp -r lib app_build/lib
          cp pubspec.yaml app_build/pubspec.yaml




      - name: Get dependencies
        working-directory: app_build
        run: flutter pub get




      - name: Static check
        working-directory: app_build
        run: flutter analyze --no-fatal-infos || true




      - name: Generate debug keystore for signing
        working-directory: app_build
        run: |
          keytool -genkeypair -v -keystore /tmp/devniques.keystore -alias devniques -keyalg RSA -keysize 2048 -validity 10000 -storepass devniques123 -keypass devniques123 -dname "CN=Devniques, OU=Dev, O=Devniques, L=Karachi, ST=Sindh, C=PK"
          echo "storeFile=/tmp/devniques.keystore" > android/key.properties
          echo "storePassword=devniques123" >> android/key.properties
          echo "keyAlias=devniques" >> android/key.properties
          echo "keyPassword=devniques123" >> android/key.properties




      - name: Configure signing in build.gradle
        working-directory: app_build
        run: |
          python3 - << 'PYEOF'
          import re
          p = 'android/app/build.gradle.kts'
          try:
              src = open(p).read()
          except FileNotFoundError:
              p = 'android/app/build.gradle'
              src = open(p).read()
          if 'key.properties' not in src:
              # Kotlin DSL
              src = src.replace('android {', '''android {
              val keystoreProperties = java.util.Properties().apply {
                  load(rootProject.file("key.properties").inputStream())
              }
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }''')
              src = src.replace('buildTypes {\n        release {', 'buildTypes {\n        release {\n            signingConfig = signingConfigs.getByName("release")')
              # Groovy fallback
              if 'signingConfigs' not in src:
                  src = src.replace('android {', """android {
              def keystoreProperties = new Properties()
              keystoreProperties.load(new FileInputStream(rootProject.file("key.properties")))
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }""")
                  src = src.replace('release {', 'release {\n            signingConfig signingConfigs.release', 1)
              open(p, 'w').write(src)
          print("signing configured")
          PYEOF




      - name: Build release APK
        working-directory: app_build
        run: flutter build apk --release




      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: devniques-finance-release-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

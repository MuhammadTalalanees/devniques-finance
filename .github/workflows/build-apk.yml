name: Build release APK


on:
  workflow_dispatch:


jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Flutter 3.47.7 (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true


      - name: Scaffold native Android shell (repo ships lib/ only)
        run: |
          flutter create --org com.devniques --project-name devniques_finance app_build
          rm -rf app_build/lib
          cp -r lib app_build/lib
          cp pubspec.yaml app_build/pubspec.yaml


      - name: Get dependencies
        working-directory: app_build
        run: flutter pub get


      - name: Static check
        working-directory: app_build
        run: flutter analyze --no-fatal-infos || true


      - name: Build release APK
        working-directory: app_build
        run: flutter build apk --release


      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: devniques-finance-release-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

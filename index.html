<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="devniques_finance">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>devniques_finance</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="df-loading" style="position:fixed;inset:0;background:#f4f6f5;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;z-index:99998;">
    <div style="width:44px;height:44px;border-radius:50%;border:5px solid #d8e2dc;border-top-color:#0a7a4b;animation:dfspin 0.9s linear infinite;"></div>
    <p id="df-loading-text" style="margin-top:18px;color:#444;font-size:15px;">Devniques Finance load ho raha hai…</p>
    <style>@keyframes dfspin{to{transform:rotate(360deg)}}</style>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Self-heal v2 (Ultron, 2026-10-20): safed screen ki teen wajahen
    // dekhi gayin — (1) Google CDN rukna [local CanvasKit se hal],
    // (2) purana service worker phansna [neeche auto-saaf],
    // (3) slow/throttled net par 11MB files ka late ana [loading
    // screen + lamba timer, download beech mein NAHI kaatna].
    (function () {
      var booted = false;
      window.addEventListener('flutter-first-frame', function () {
        booted = true;
        var el = document.getElementById('df-loading');
        if (el) el.remove();
        try { sessionStorage.removeItem('df_healed'); } catch (e) {}
      });
      setTimeout(function () {
        if (booted) return;
        var healed = false;
        try { healed = !!sessionStorage.getItem('df_healed'); } catch (e) {}
        if (!healed) {
          try { sessionStorage.setItem('df_healed', '1'); } catch (e) {}
          var jobs = [];
          if ('serviceWorker' in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            }).catch(function () {}));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            }).catch(function () {}));
          }
          Promise.all(jobs).then(function () {
            setTimeout(function () { location.reload(); }, 400);
          });
        }
      }, 60000);
      setTimeout(function () {
        if (booted) return;
        var t = document.getElementById('df-loading-text');
        if (t) t.textContent = 'Abhi bhi load ho raha hai — net slow hai to kuch minute lag sakte hain. Page khula rakhen, khud khul jayega.';
      }, 150000);
    })();
  </script>
</body>
</html>
